# Workflow para intentar compilar APK de Friday Night Funkin' en GitHub Actions
# Coloca este archivo en: .github/workflows/build-android.yml

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-35 platforms;android-29 build-tools;35.0.0'

      - name: Install Android NDK 29.0.13113456
        run: |
          yes | sdkmanager --install "ndk;29.0.13113456" || true
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.13113456" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.13113456" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          ls "$ANDROID_HOME/ndk/" || true

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6

      - name: Install system dependencies (necesarios para rebuild de Lime)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libglu1-mesa-dev \
            g++ g++-multilib gcc-multilib \
            libasound2-dev libx11-dev libxext-dev libxi-dev \
            libxrandr-dev libxinerama-dev libpulse-dev

      - name: Install Haxe libraries with hmm
        run: |
          haxelib --global install hmm
          haxelib --global run hmm setup

          if [ -f hmm.json ]; then
            echo "=== Instalando dependencias desde hmm.json ==="
            haxelib --global run hmm install
          else
            haxelib install lime
            haxelib install openfl
          fi

          echo "=== Lista de librerías ==="
          haxelib list
          echo "=== Ubicación de Lime ==="
          haxelib path lime || true
          ls -la .haxelib/lime/ || true

      - name: Fix Lime submodules + rebuild ndll (el paso más importante)
        run: |
          LIME_PATH=""
          if [ -d ".haxelib/lime/git" ]; then
            LIME_PATH=".haxelib/lime/git"
          elif [ -d ".haxelib/lime" ]; then
            LIME_PATH=$(find .haxelib/lime -maxdepth 1 -type d | tail -1)
          fi

          echo "Lime path: $LIME_PATH"

          if [ -n "$LIME_PATH" ] && [ -d "$LIME_PATH" ]; then
            echo "=== Inicializando submódulos de Lime ==="
            cd "$LIME_PATH"
            git submodule init || true
            git submodule sync || true
            git submodule update --init --recursive || true
            cd - 

            echo "=== Reconstruyendo Lime (cpp -64) ==="
            haxelib run lime rebuild cpp -64 -release -clean || haxelib run lime rebuild linux -64 -release -clean || true

            echo "=== Buscando lime.ndll ==="
            find .haxelib -name "lime.ndll" 2>/dev/null || echo "Todavía no aparece lime.ndll"
          else
            echo "No se encontró carpeta de Lime"
          fi

      - name: Configure Lime for Android
        run: |
          mkdir -p ~/.lime
          cat > ~/.lime/config << EOF
          android.sdk=$ANDROID_HOME
          android.ndk=$ANDROID_NDK_HOME
          java.path=$JAVA_HOME
          EOF

          echo "=== Config de Lime ==="
          cat ~/.lime/config

          haxelib run lime setup || true
          haxelib run lime config ANDROID_SETUP true || true
          echo -e "$ANDROID_HOME\n$ANDROID_NDK_HOME\n$JAVA_HOME\n" | haxelib run lime setup android || true

      - name: Rebuild Lime for Android target
        run: |
          echo "=== Rebuild Android ==="
          haxelib run lime rebuild android || true

      - name: Build APK
        run: |
          echo "=== Variables de entorno ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "JAVA_HOME=$JAVA_HOME"

          echo "=== Iniciando build ==="
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            haxelib run lime build android -v -release
          else
            haxelib run lime build android -v -debug
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Android-APK
          path: |
            export/**/*.apk
            **/*.apk
          if-no-files-found: warn
          retention-days: 5

      - name: Debug - list files
        if: always()
        run: |
          echo "=== Buscando APKs ==="
          find . -name "*.apk" 2>/dev/null || echo "No hay APK"
          echo "=== export/ ==="
          ls -laR export/ 2>/dev/null || true
          echo "=== .haxelib/lime ==="
          find .haxelib/lime -name "*.ndll" 2>/dev/null || true
